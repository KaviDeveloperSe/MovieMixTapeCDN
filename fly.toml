app = "moviemixtapecdn"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  MAX_RANGE_SIZE = "104857600"
  TOKEN_TTL_SECONDS = "3600"
  UPSTREAM_TIMEOUT_MS = "15000"
  STREAM_SECRET="your_32_char_secret"
  ALLOWED_ORIGINS="https://myfrontend.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]