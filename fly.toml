app = 'moviemixtapecdn'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://myfrontend.com'
  LOG_LEVEL = 'info'
  MAX_RANGE_SIZE = '104857600'
  NODE_ENV = 'production'
  PORT = '8080'
  STREAM_SECRET = '028382e50fe0b5a78f2725ade2e3043b'
  TOKEN_TTL_SECONDS = '3600'
  UPSTREAM_TIMEOUT_MS = '15000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256